<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tactics (SVG Board)</title>

  <!-- cm-chessboard UMD + CSS → 依存ゼロでロード -->
  <link href="https://cdn.jsdelivr.net/npm/cm-chessboard@8.7.8/assets/chessboard.css"
        rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/cm-chessboard@8.7.8/cjs/cm-chessboard-min.js"></script>
  <!-- ↑ UMD ビルドなので <script type=\"module\"> 不要 -->

  <style>
    body{margin:0;font-family:system-ui,sans-serif;height:100vh;display:flex}
    #side{width:280px;overflow-y:auto;border-right:1px solid #ddd;padding:8px;box-sizing:border-box}
    #main{flex:1;display:flex;flex-direction:column}
    #boardBox{flex:1;display:flex;justify-content:center;align-items:center}
    ul{list-style:none;padding:0;margin:0} a{display:block;padding:4px 6px;
      text-decoration:none;color:#036;border-radius:4px} a:hover{background:#eef}
    .v{color:purple!important} #info{padding:8px;border-bottom:1px solid #ddd;background:#fafafa}
  </style>
</head>
<body>
  <div id="side">
    <h2>Problems</h2>
    <input id="filter" placeholder="Filter…" style="width:100%;padding:4px;margin-bottom:6px">
    <ul id="list"></ul>
  </div>

  <div id="main">
    <div id="info">select a problem</div>
    <div id="boardBox"><div id="board" style="width:min(90vmin,500px)"></div></div>
  </div>

<script>
(async () => {
  // ---------- ① データ読込 ----------
  let probs=[];
  try{
    const r=await fetch('problems.json'); if(!r.ok) throw 0;
    probs=(await r.json()).problems;
  }catch{
    probs=[{problemid:1,type:'Mate in One',first:'White',fen:'3q1rk1/5pbp/5Qp1/8/8/2B5/5PPP/6K1 w - -'}];
  }

  // ---------- ② SVG ボード初期化 ----------
  const board=new Chessboard(document.getElementById('board'),{
    position:'start',
    sprite: { // 駒 SVG 一式のある CDN パス
      url:"https://cdn.jsdelivr.net/npm/cm-chessboard@8.7.8/assets/chessboard-sprite.svg"
    }
  }); // 駒 PNG 問題が完全に解消 :contentReference[oaicite:3]{index=3}

  const vis=new Set(JSON.parse(localStorage.getItem('vis')||'[]'));
  const list=document.getElementById('list');
  const info=document.getElementById('info');

  // ---------- ③ リスト描画 & フィルタ ----------
  function draw(q=''){
    list.innerHTML='';
    probs.filter(p=>String(p.problemid).includes(q)||p.type.toLowerCase().includes(q.toLowerCase()))
         .forEach(p=>{
           const a=document.createElement('a');
           a.textContent=`#${p.problemid} – ${p.type}`;
           if(vis.has(p.problemid)) a.classList.add('v');
           a.onclick=()=>open(p,a); list.appendChild(a);
         });
  }
  document.getElementById('filter').oninput=e=>draw(e.target.value);
  draw();

  // ---------- ④ 問題オープン ----------
  function open(p,link){
    board.setPosition(p.fen);
    info.textContent=`#${p.problemid} – ${p.type} (${p.first} to move)`;
    vis.add(p.problemid);
    localStorage.setItem('vis',JSON.stringify([...vis]));
    link.classList.add('v'); // visited coloring
  }
})();
</script>
</body>
</html>
