<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chess Tactics+</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cm-chessboard@8.7.1/assets/chessboard.css">
  <style>
    :root {
      --blue: #1373d1;
      --blue-h: #0e59a6;
      --purple: #6a1b9a;
      --yellow: #fff2aa;
      --red: #d32f2f;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
    }

    /* ---- 左パネル ---- */
    #side {
      width: 320px;
      min-width: 240px;
      border-right: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #side h2 {
      margin: 10px;
      font-size: 20px;
    }

    #filter {
      margin: 0 10px 8px;
      padding: 6px 8px;
      border: 1px solid #bbb;
      border-radius: 4px;
    }

    #list {
      flex: 1;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .groupBtn {
      width: 100%;
      text-align: left;
      border: none;
      background: #f5f5f5;
      padding: 6px 8px;
      font-weight: bold;
      cursor: pointer;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .groupBtn:hover {
      background: #e9e9e9;
    }

    .arrow {
      transition: .2s;
    }

    .closed>.arrow {
      transform: rotate(-90deg);
    }

    .count {
      font-size: 12px;
      color: #666;
    }

    .subList {
      display: none;
      padding-left: 14px;
    }

    .open>.subList {
      display: block;
    }

    .link {
      display: block;
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--blue);
      text-decoration: none;
    }

    .link:hover {
      background: #eaf2ff;
      color: var(--blue-h);
    }

    .solved {
      color: var(--purple);
      opacity: .8;
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }

    .hardMark {
      color: var(--red);
      font-weight: bold;
    }

    .current {
      background: var(--yellow);
    }

    #progress {
      padding: 10px;
      font-size: 12px;
      color: #555;
      border-top: 1px solid #ccc;
    }

    #barWrap {
      height: 6px;
      background: #ddd;
      border-radius: 3px;
      margin-top: 4px;
    }

    #bar {
      height: 100%;
      background: #4caf50;
      border-radius: 3px;
      width: 0;
    }

    /* ---- 右パネル ---- */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px;
      align-items: center;
    }

    button,
    a.btn {
      padding: 6px 12px;
      border: 1px solid #666;
      border-radius: 6px;
      background: #f6f6f6;
      cursor: pointer;
      text-decoration: none;
      color: #000;
    }

    button:hover,
    a.btn:hover {
      background: #eee;
    }

    #title {
      font-size: 20px;
      margin: 4px 0;
    }

    #timer {
      min-width: 64px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: bold;
    }

    /* 盤サイズ 700 px */
    #board {
      width: 100%;
      max-width: 700px;
      height: 700px;
      max-height: 700px;
    }
  </style>
</head>

<body>
  <!-- 左側 -->
  <div id="side">
    <h2>Problems</h2>
    <input id="filter" placeholder="Filter…">
    <ul id="list"></ul>
    <div id="progress">
      <span id="pTxt">0 / 0 solved</span>
      <div id="barWrap">
        <div id="bar"></div>
      </div>
    </div>
  </div>

  <!-- 右側 -->
  <div id="main">
    <div id="toolbar">
      <button id="prev">◀ Prev</button>
      <button id="randAll">Rand (ALL)</button>
      <button id="randGrp">Rand (group)</button>
      <button id="randHard">Rand (Hard★)</button>
      <button id="next">Next ▶</button>
      <button id="solvedBtn" disabled>Solved ✔</button>
      <button id="hardBtn" disabled>Mark Hard ★</button>
      <span id="timer">00:00</span>
      <a id="lichess" class="btn" href="#" target="_blank">Lichess ↗</a>
    </div>
    <h1 id="title">Loading…</h1>
    <div id="board"></div>
  </div>

  <script type="module">
    import { Chessboard }
      from 'https://cdn.jsdelivr.net/npm/cm-chessboard@8.7.1/src/Chessboard.js';

    /* -------- constants -------- */
    const TIME_LIMIT = 120; // 秒 (2 分)

    /* -------- state -------- */
    let problems = [], idx = 0, startTime = 0, timerId;
    const solved = new Set(JSON.parse(localStorage.getItem('solved') || '[]'));
    const hard = new Set(JSON.parse(localStorage.getItem('hard') || '[]'));
    const openGroups = new Set();

    /* -------- DOM -------- */
    const $ = s => document.querySelector(s);
    const list = $('#list'), title = $('#title'), lichess = $('#lichess'),
      solvedBtn = $('#solvedBtn'), bar = $('#bar'), pTxt = $('#pTxt'), timer = $('#timer'),
      hardBtn = $('#hardBtn'), randHard = $('#randHard');

    /* -------- board -------- */
    const board = new Chessboard($('#board'), {
      assetsUrl: 'https://cdn.jsdelivr.net/npm/cm-chessboard@8.7.1/assets/',
      style: { moveInputMode: 'none' }
    });

    /* helpers */
    const fenURL = f => `https://lichess.org/analysis/${f.replace(/ /g, '_')}`;
    function gKey(t) {
      const s = t.toLowerCase();
      const m = s.match(/mate in (\d+)/);
      if (m) return `Mate in ${m[1]}`;
      const w = s.match(/mate in (one|two|three|four|five)/);
      if (w) {
        const map = { one: 1, two: 2, three: 3, four: 4, five: 5 };
        return `Mate in ${map[w[1]]}`;
      }
      return 'Others';
    }
    const gSort = (a, b) => (parseInt(a.match(/\d+/)) || 99) - (parseInt(b.match(/\d+/)) || 99);
    function updBar() {
      pTxt.textContent = `${solved.size}/${problems.length} solved`;
      bar.style.width = `${solved.size / problems.length * 100}%`;
    }

    /* timer functions */
    function startTimer() {
      clearInterval(timerId);
      startTime = Date.now();
      tick();
      timerId = setInterval(tick, 1000);
    }
    function tick() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const remain = Math.max(0, TIME_LIMIT - elapsed);
      const m = String(Math.floor(remain / 60)).padStart(2, '0');
      const s = String(remain % 60).padStart(2, '0');
      timer.textContent = `${m}:${s}`;
      if (remain === 0) clearInterval(timerId);
    }

    /* list render */
    function render(filter = '') {
      list.innerHTML = '';
      const grp = {}; problems.forEach(p => (grp[gKey(p.type)] ??= ([])).push(p));
      Object.keys(grp).sort(gSort).forEach(g => {
        const arr = grp[g], done = arr.filter(p => solved.has(p.problemid)).length;
        const li = document.createElement('li');
        li.className = 'groupItem ' + (openGroups.has(g) ? 'open' : 'closed');
        li.innerHTML = `<button class="groupBtn">
        <span>${g}</span>
        <span class="count">${done}/${arr.length}
          <span class="arrow">▶</span></span></button>`;
        li.querySelector('.groupBtn').onclick = () => {
          openGroups.has(g) ? openGroups.delete(g) : openGroups.add(g);
          li.classList.toggle('open'); li.classList.toggle('closed');
        };
        const ul = document.createElement('ul'); ul.className = 'subList';
        arr.forEach(p => {
          if (filter && !`${p.problemid}`.includes(filter) &&
            !p.type.toLowerCase().includes(filter)) return;
          const sub = document.createElement('li');
          const cls = [
            'link',
            solved.has(p.problemid) ? 'solved' : '',
            hard.has(p.problemid) ? 'hardMark' : ''
          ].join(' ');
          sub.innerHTML = `<a class="${cls}"
           data-id="${p.problemid}" href="#">#${p.problemid}</a>`;
          sub.firstElementChild.onclick = e => { e.preventDefault(); idx = problems.indexOf(p); load(); };
          ul.appendChild(sub);
        });
        li.appendChild(ul); list.appendChild(li);
      });
      highlight();
    }
    function highlight() {
      list.querySelectorAll('.link').forEach(a => a.classList.remove('current'));
      const cur = list.querySelector(`.link[data-id="${problems[idx].problemid}"]`);
      cur?.classList.add('current'); cur?.scrollIntoView({ block: 'nearest' });
    }

    /* load problem */
    function load() {
      const p = problems[idx];
      const active = p.fen.split(' ')[1] === 'w' ? 'White to move' : 'Black to move';
      title.textContent = `#${p.problemid} – ${p.type} (${active})`;
      board.setPosition(p.fen, true);
      lichess.href = fenURL(p.fen);
      solvedBtn.disabled = false;
      hardBtn.disabled = false;
      solvedBtn.textContent = solved.has(p.problemid) ? 'Solved ✔' : 'Mark Solved';
      hardBtn.textContent = hard.has(p.problemid) ? 'Hard ★' : 'Mark Hard ★';
      randHard.disabled = hard.size === 0;
      openGroups.add(gKey(p.type));
      render($('#filter').value.toLowerCase());
      updBar();
      startTimer();
    }

    /* solved */
    solvedBtn.onclick = () => {
      const id = problems[idx].problemid;
      solved.add(id);
      localStorage.setItem('solved', JSON.stringify([...solved]));
      // If solved after timeout, also mark hard automatically
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      if (elapsed > TIME_LIMIT) {
        hard.add(id);
        localStorage.setItem('hard', JSON.stringify([...hard]));
      }
      idx = (idx + 1) % problems.length; load();
    };

    /* hard toggle */
    hardBtn.onclick = () => {
      const id = problems[idx].problemid;
      if (hard.has(id)) hard.delete(id); else hard.add(id);
      localStorage.setItem('hard', JSON.stringify([...hard]));
      hardBtn.textContent = hard.has(id) ? 'Hard ★' : 'Mark Hard ★';
      randHard.disabled = hard.size === 0;
      render($('#filter').value.toLowerCase());
    };

    /* nav buttons */
    $('#prev').onclick = () => { idx = (idx - 1 + problems.length) % problems.length; load(); };
    $('#next').onclick = () => { idx = (idx + 1) % problems.length; load(); };
    $('#randAll').onclick = () => { idx = (Math.random() * problems.length) | 0; load(); };
    $('#randGrp').onclick = () => {
      const same = problems.filter(p => gKey(p.type) === gKey(problems[idx].type));
      idx = problems.indexOf(same[(Math.random() * same.length) | 0]); load();
    };
    randHard.onclick = () => {
      const hardProblems = problems.filter(p => hard.has(p.problemid));
      if (hardProblems.length === 0) return;
      idx = problems.indexOf(hardProblems[(Math.random() * hardProblems.length) | 0]);
      load();
    };

    /* filter */
    $('#filter').oninput = e => render(e.target.value.toLowerCase());

    /* keyboard shortcuts */
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      switch (e.key) {
        case 'ArrowLeft': $('#prev').click(); break;
        case 'ArrowRight': $('#next').click(); break;
        case 'r': case 'R': $('#randAll').click(); break;
        case 'g': case 'G': $('#randGrp').click(); break;
        case 'h': case 'H': if (!hardBtn.disabled) { e.preventDefault(); hardBtn.click(); } break;
        case 'd': case 'D': if (!randHard.disabled) { e.preventDefault(); randHard.click(); } break; // d = hard rand
        case 's': case 'S':
        case 'Enter':
          if (!solvedBtn.disabled) {
            e.preventDefault();
            solvedBtn.click();
          }
          break;
      }
    });

    /* fetch problems */
    (async () => {
      problems = (await fetch('problems.json').then(r => r.json())).problems;
      load();
    })();
  </script>
</body>

</html>
