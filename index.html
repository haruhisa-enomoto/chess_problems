<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Tactics Trainer</title>

  <!-- Tailwind Play CDN (OK for GitHub Pages) -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <!-- Alpine.js for reactivity -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Chessground (UMD bundle from cdnjs 9.1.1) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessground/9.1.1/chessground.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessground/9.1.1/chessground.min.js"></script></script>
  <!-- Fallback if cdnjs blocked -->
  <script>
    if (!window.Chessground) {
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/chessground@9.1.1/dist/chessground.min.js';
      document.head.appendChild(s);
    }
  </script>

  <style>
    .board-wrapper { position: relative; width: 100%; padding-top: 100%; }
    #board { position: absolute; inset: 0; }
  </style>
</head>
<body x-data="trainerApp()" x-init="init()" class="bg-gray-50 text-gray-800">
  <div class="flex flex-col md:flex-row h-screen">
    <!-- Sidebar -->
    <aside class="w-full md:w-80 bg-white border-r border-gray-200 overflow-y-auto">
      <div class="flex items-center justify-between p-4 border-b border-gray-200">
        <h1 class="text-xl font-bold">Tactics Trainer</h1>
      </div>

      <div class="p-4 space-y-3">
        <input type="search" placeholder="Search ID or type…" x-model="query" @input="filterList()" class="w-full px-3 py-2 rounded border border-gray-300 bg-gray-100" />
        <div class="text-sm text-gray-500" x-text="`${visited.size} / ${problems.length} solved`"></div>
        <div class="w-full bg-gray-200 rounded h-2"><div class="bg-green-500 h-2 rounded" :style="`width:${progress}%`"></div></div>
      </div>

      <nav class="px-4 pb-6 space-y-1">
        <template x-for="group in grouped" :key="group.name">
          <details class="group" open>
            <summary class="cursor-pointer flex items-center justify-between py-2 text-lg font-medium hover:text-blue-600">
              <span x-text="group.name"></span>
              <span class="text-sm" x-text="group.items.length"></span>
            </summary>
            <ul class="pl-4 space-y-1">
              <template x-for="item in group.items" :key="item.problemid">
                <li><a href="#" @click.prevent="openProblem(item)" :class="{'text-purple-600': visited.has(item.problemid)}" class="block px-2 py-1 rounded hover:bg-gray-100" x-text="`#${item.problemid}`"></a></li>
              </template>
            </ul>
          </details>
        </template>
      </nav>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col">
      <header class="p-4 border-b border-gray-200 bg-white"><h2 class="text-lg font-semibold" x-text="currentLabel"></h2></header>
      <section class="flex-1 flex items-center justify-center p-4"><div class="board-wrapper w-full max-w-xl"><div id="board"></div></div></section>
    </main>
  </div>

  <script>
    function trainerApp() {
      const STORAGE_VISITED = 'visitedProblems';
      const STORAGE_LAST = 'lastProblem';
      return {
        problems: [],
        grouped: [],
        visited: new Set(JSON.parse(localStorage.getItem(STORAGE_VISITED) || '[]')),
        query: '',
        currentLabel: 'Pick a problem',
        cg: null,
        get progress() { return this.problems.length ? (this.visited.size / this.problems.length) * 100 : 0; },
        filterList() {
          const q = this.query.toLowerCase();
          this.grouped = groupByType(q ? this.problems.filter(p => String(p.problemid).includes(q) || p.type.toLowerCase().includes(q)) : this.problems);
        },
        openProblem(item) {
          if (!window.Chessground) { alert('Chessground still failed to load. Try reloading after cache clear.'); return; }
          const orientation = /black/i.test(item.first) ? 'black' : 'white';
          this.cg ? this.cg.set({ fen: item.fen, orientation }) : (this.cg = Chessground(document.getElementById('board'), { fen: item.fen, orientation, coordinates: true }));
          this.currentLabel = `#${item.problemid} – ${item.type} (${item.first})`;
          this.visited.add(item.problemid);
          localStorage.setItem(STORAGE_VISITED, JSON.stringify([...this.visited]));
          localStorage.setItem(STORAGE_LAST, item.problemid);
        },
        async init() {
          try {
            const res = await fetch('problems.json');
            if (!res.ok) throw new Error('fetch failed');
            const data = await res.json();
            this.problems = data.problems;
          } catch (e) {
            // Fallback sample problems to avoid blank page
            console.error('problems.json missing, loading demo data');
            this.problems = [
              {problemid:1, first:'White to Move', type:'Mate in One', fen:'3q1rk1/5pbp/5Qp1/8/8/2B5/5PPP/6K1 w - - 0 1'},
              {problemid:2, first:'White to Move', type:'Mate in One', fen:'2r2rk1/2q2p1p/6pQ/4P1N1/8/8/PPP5/2KR4 w - - 0 1'}
            ];
          }
          this.grouped = groupByType(this.problems);
          const last = localStorage.getItem(STORAGE_LAST);
          if (last) { const p = this.problems.find(p => p.problemid == last); if (p) this.openProblem(p); } (e) { console.error(e); alert('Failed to load problems.json'); }
        },
      };
      function groupByType(arr) { const map = {}; arr.forEach(p => (map[p.type] = map[p.type] || []).push(p)); return Object.keys(map).map(k => ({ name: k, items: map[k] })); }
    }
  </script>
</body>
</html>
