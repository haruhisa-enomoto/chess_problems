<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lichess Positions</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: row;
    }

    #leftPanel {
      width: 40%;
      overflow-y: auto;
      border-right: 1px solid #ccc;
      padding: 10px;
      box-sizing: border-box;
    }

    #rightPanel {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .accordion {
      background-color: #eee;
      color: #444;
      cursor: pointer;
      padding: 10px;
      width: 100%;
      border: none;
      text-align: left;
      outline: none;
      font-size: 18px;
      transition: 0.4s;
      margin-top: 5px;
    }

    .active,
    .accordion:hover {
      background-color: #ccc;
    }

    .panel {
      padding: 0 18px;
      display: none;
      background-color: white;
      overflow: hidden;
    }

    h1 {
      margin-top: 0;
    }

    iframe {
      flex: 1;
      border: none;
      width: 100%;
    }

    #topControls {
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 10;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    #currentProblem {
      background: #ffc;
      padding: 10px;
      font-size: 20px;
      border-bottom: 1px solid #ccc;
    }

    /* クリック済みリンクの色を変えるためのクラス */
    .visitedLink {
      color: purple !important;
    }
  </style>
</head>
<body>
  <div id="leftPanel">
    <h1>Lichess Positions</h1>
    <div id="topControls">
      <input type="number" id="problemNumber" placeholder="Enter problem number"/>
      <button id="goButton">Go</button>
      <button id="randomButton">Random</button>
    </div>
    <div id="positionsContainer"></div>
  </div>
  <div id="rightPanel">
    <div id="currentProblem">No problem selected</div>
    <iframe id="lichessFrame"></iframe>
  </div>

  <script>
    // 最後に開いた問題IDを保存する
    function storeLastProblem(problemId) {
      localStorage.setItem('lastProblem', problemId);
    }

    // 最後に開いた問題IDを取得する
    function getLastProblem() {
      return localStorage.getItem('lastProblem');
    }

    // 訪問済みの問題IDリストを保存する
    function storeVisitedProblem(problemId) {
      const visitedString = localStorage.getItem('visitedProblems');
      let visited = visitedString ? JSON.parse(visitedString) : [];
      // 数値・文字列混在を避けるため、文字列で統一
      if (!visited.includes(String(problemId))) {
        visited.push(String(problemId));
        localStorage.setItem('visitedProblems', JSON.stringify(visited));
      }
    }

    // 訪問済みの問題IDリストを取得する
    function getVisitedProblems() {
      const visitedString = localStorage.getItem('visitedProblems');
      return visitedString ? JSON.parse(visitedString) : [];
    }

    // 全問題データを取得
    async function fetchProblems() {
      const response = await fetch('problems.json');
      const data = await response.json();
      return data.problems;
    }

    // 左側に問題リストを描画
    function loadPositions(problems) {
      const positionsContainer = document.getElementById('positionsContainer');
      const problemsByType = {};

      // 訪問済みの問題一覧を先に取得
      const visitedProblems = getVisitedProblems();

      problems.forEach((problem) => {
        const { type } = problem;
        if (!problemsByType[type]) {
          problemsByType[type] = [];
        }
        problemsByType[type].push(problem);
      });

      Object.keys(problemsByType).forEach((type) => {
        const typeDiv = document.createElement('div');
        const typeTitle = document.createElement('h2');
        typeTitle.textContent = type;
        typeDiv.appendChild(typeTitle);

        const problemsForType = problemsByType[type];
        let start = Math.floor(problemsForType[0].problemid / 100) * 100;
        let end = start + 99;

        while (start <= problemsForType[problemsForType.length - 1].problemid) {
          const sublist = problemsForType.filter(
            (problem) => problem.problemid >= start && problem.problemid <= end
          );
          if (sublist.length > 0) {
            const sublistButton = document.createElement('button');
            sublistButton.className = 'accordion';
            sublistButton.textContent = `${type} (${start} - ${end})`;

            const panelDiv = document.createElement('div');
            panelDiv.className = 'panel';
            const ul = document.createElement('ul');

            sublist.forEach((problem) => {
              const li = document.createElement('li');
              const fen = problem.fen;
              const formattedFen = fen.replace(/ /g, '_');
              const lichessLink = `https://lichess.org/analysis/${formattedFen}`;

              const link = document.createElement('a');
              link.href = '#';
              link.textContent = `Problem ${problem.problemid}`;
              // 訪問済みなら色を変える
              if (visitedProblems.includes(String(problem.problemid))) {
                link.classList.add('visitedLink');
              }

              link.addEventListener('click', (event) => {
                event.preventDefault();
                const iframe = document.getElementById('lichessFrame');
                iframe.src = lichessLink;
                document.getElementById('currentProblem').textContent = `Selected Problem: ${problem.problemid}`;

                // クッキーやlocalStorageに保存
                storeLastProblem(problem.problemid);
                storeVisitedProblem(problem.problemid);

                // 今回クリックしたリンクの色を即座に変える
                link.classList.add('visitedLink');
              });

              li.appendChild(link);
              ul.appendChild(li);
            });

            panelDiv.appendChild(ul);
            typeDiv.appendChild(sublistButton);
            typeDiv.appendChild(panelDiv);
          }
          start = end + 1;
          end = start + 99;
        }

        positionsContainer.appendChild(typeDiv);
      });

      // アコーディオン機能
      const acc = document.getElementsByClassName('accordion');
      for (let j = 0; j < acc.length; j++) {
        acc[j].addEventListener('click', function () {
          this.classList.toggle('active');
          const panel = this.nextElementSibling;
          if (panel.style.display === 'block') {
            panel.style.display = 'none';
          } else {
            panel.style.display = 'block';
          }
        });
      }
    }

    // 指定したproblemNumberの問題を開く
    function openProblemByNumber(problems, problemNumber) {
      const problem = problems.find((p) => p.problemid == problemNumber);
      if (problem) {
        const formattedFen = problem.fen.replace(/ /g, '_');
        const lichessLink = `https://lichess.org/analysis/${formattedFen}`;
        const iframe = document.getElementById('lichessFrame');
        iframe.src = lichessLink;
        document.getElementById('currentProblem').textContent = `Selected Problem: ${problem.problemid}`;

        storeLastProblem(problem.problemid);
        storeVisitedProblem(problem.problemid);
      } else {
        alert('Problem not found');
      }
    }

    // ランダムな問題を開く
    function openRandomProblem(problems) {
      const randomIndex = Math.floor(Math.random() * problems.length);
      const randomProblem = problems[randomIndex];
      if (randomProblem) {
        openProblemByNumber(problems, randomProblem.problemid);
        document.getElementById('problemNumber').value = randomProblem.problemid;
      }
    }

    // ページ初期化
    async function init() {
      const problems = await fetchProblems();
      loadPositions(problems);

      // Goボタン押下で問題を開く
      document.getElementById('goButton').addEventListener('click', () => {
        const problemNumber = document.getElementById('problemNumber').value;
        openProblemByNumber(problems, problemNumber);
      });
      // Enterキーでも同様に
      document.getElementById('problemNumber').addEventListener('keypress', function (event) {
        if (event.key === 'Enter') {
          const problemNumber = document.getElementById('problemNumber').value;
          openProblemByNumber(problems, problemNumber);
        }
      });

      // Randomボタンでランダムに問題を開く
      document.getElementById('randomButton').addEventListener('click', () => {
        openRandomProblem(problems);
      });

      // 最後に開いていた問題があれば自動的に開く
      const lastProblem = getLastProblem();
      if (lastProblem) {
        openProblemByNumber(problems, lastProblem);
        document.getElementById('problemNumber').value = lastProblem;
      }
    }

    init();
  </script>
</body>
</html>
