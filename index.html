<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Tactics Trainer</title>
  <!-- Tailwind Play CDN for rapid prototyping -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <!-- Alpine.js for lightweight reactivity -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Feather icons (optional) -->
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    /* Smooth scrolling for anchor links (optional) */
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body
  x-data="trainerApp()"
  x-init="init()"
  :class="dark ? 'dark' : ''"
  class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100"
>
  <div class="flex flex-col md:flex-row h-screen">
    <!-- Sidebar -->
    <aside
      class="w-full md:w-80 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 overflow-y-auto"
    >
      <div
        class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700"
      >
        <h1 class="text-xl font-bold">Tactics Trainer</h1>
        <button
          @click="toggleDark()"
          class="p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700"
          aria-label="Toggle dark mode"
        >
          <!-- Heroicon sun/moon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m8-8h1M3 12H2m15.36 6.36l.707.707M6.343 6.343l.707.707m12.02 0l-.707.707m0 12.02l-.707-.707M6.343 17.657l.707-.707"
            />
          </svg>
        </button>
      </div>

      <div class="p-4 space-y-2">
        <input
          type="search"
          placeholder="Search ID or type..."
          class="w-full px-3 py-2 rounded border border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-gray-700"
          x-model="query"
          @input="filterList()"
        />
        <div class="text-sm text-gray-500" x-text="`${visited.size} / ${problems.length} solved`"></div>
        <div class="w-full bg-gray-200 dark:bg-gray-700 rounded h-2">
          <div
            class="bg-green-500 h-2 rounded"
            :style="`width:${progress}%`"
          ></div>
        </div>
      </div>

      <nav class="px-4 pb-4 space-y-1">
        <template x-for="group in grouped" :key="group.name">
          <details class="group" open>
            <summary
              class="cursor-pointer flex items-center justify-between py-2 text-lg font-medium hover:text-blue-600 dark:hover:text-blue-400"
            >
              <span x-text="group.name"></span>
              <span class="text-sm" x-text="`${group.items.length}`"></span>
            </summary>
            <ul class="pl-4 space-y-1">
              <template x-for="item in group.items" :key="item.problemid">
                <li>
                  <a
                    href="#"
                    @click.prevent="openProblem(item)"
                    :class="{'text-purple-600': visited.has(item.problemid)}"
                    class="block px-2 py-1 rounded hover:bg-gray-100 dark:hover:bg-gray-700"
                    x-text="`#${item.problemid}`"
                  ></a>
                </li>
              </template>
            </ul>
          </details>
        </template>
      </nav>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col">
      <header
        class="p-4 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800"
      >
        <h2 class="text-lg font-semibold" x-text="currentLabel"></h2>
      </header>
      <section class="flex-1">
        <iframe
          id="board"
          class="w-full h-full"
          :src="currentSrc"
          frameborder="0"
          allowfullscreen
        ></iframe>
      </section>
    </main>
  </div>

  <script>
    function trainerApp() {
      return {
        problems: [],
        grouped: [],
        visited: new Set(
          JSON.parse(localStorage.getItem('visitedProblems') || '[]')
        ),
        currentSrc: '',
        currentLabel: 'Pick a problem',
        query: '',
        dark: localStorage.getItem('darkMode') === 'true',
        get progress() {
          return this.problems.length
            ? (this.visited.size / this.problems.length) * 100
            : 0;
        },
        toggleDark() {
          this.dark = !this.dark;
          localStorage.setItem('darkMode', this.dark);
        },
        filterList() {
          if (!this.query) {
            this.grouped = groupByType(this.problems);
            return;
          }
          const q = this.query.toLowerCase();
          this.grouped = groupByType(
            this.problems.filter(
              (p) =>
                String(p.problemid).includes(q) ||
                p.type.toLowerCase().includes(q)
            )
          );
        },
        openProblem(item) {
          const fenUrl = encodeURIComponent(item.fen);
          // Use lichess embed widget for a light-weight board
          this.currentSrc = `https://lichess.org/embed/board?fen=${fenUrl}&bg=system`;
          this.currentLabel = `#${item.problemid} – ${item.type}`;
          this.visited.add(item.problemid);
          localStorage.setItem(
            'visitedProblems',
            JSON.stringify(Array.from(this.visited))
          );
          localStorage.setItem('lastProblem', item.problemid);
        },
        async init() {
          const res = await fetch('problems.json');
          const data = await res.json();
          this.problems = data.problems;
          this.grouped = groupByType(this.problems);
          // Restore last session
          const last = localStorage.getItem('lastProblem');
          if (last) {
            const p = this.problems.find((p) => p.problemid == last);
            if (p) this.openProblem(p);
          }
        },
      };
      function groupByType(arr) {
        const map = {};
        arr.forEach((p) => {
          (map[p.type] = map[p.type] || []).push(p);
        });
        return Object.keys(map).map((k) => ({ name: k, items: map[k] }));
      }
    }
  </script>
  <script>feather.replace();</script>
</body>
</html>
