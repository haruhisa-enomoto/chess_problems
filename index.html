<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chess Tactics+</title>

  <!-- 自作スタイル -->
  <link rel="stylesheet" href="css/style.css">
  <!-- cm-chessboard のスタイル -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cm-chessboard@8.7.1/assets/chessboard.css">
</head>

<body class="drawer-closed">
  <!-- サイドバー（ドロワー） -->
  <div id="side" aria-label="問題一覧">
    <h2>Problems</h2>
    <input id="filter" placeholder="Filter…" aria-label="問題フィルター">
    <ul id="list"></ul>
    <div id="progress" aria-live="polite">
      <span id="pTxt">0 / 0 solved</span>
      <div id="barWrap">
        <div id="bar"></div>
      </div>
    </div>
  </div>

  <!-- メイン領域 -->
  <div id="main">
    <div id="toolbar">
      <button id="toggleSidebar" aria-label="サイドバー開閉">☰</button>
      <button id="prev" aria-label="前の問題">◀</button>
      <button id="randAll">🎲</button>
      <button id="randGrp">🎲🎲</button>
      <button id="randHard">🎲💪</button>
      <button id="next" aria-label="次の問題">▶</button>
      <button id="solvedBtn" disabled>✅</button>
      <button id="hardBtn" disabled>💪</button>
      <!-- <button id="exportBtn">Export</button>
      <button id="importBtn">Import</button>
      <input type="file" id="importFile" accept=".json" style="display:none"> -->
      <span id="timer">00:00</span>
      <a id="lichess" class="btn" href="#" target="_blank" rel="noopener">♘</a>
    </div>
    <h1 id="title">Loading…</h1>
    <div id="board" role="region" aria-label="チェス盤"></div>
  </div>

  <!-- アプリ本体のスクリプト -->
  <script type="module" src="js/app.js"></script>
</body>

</html>
